name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('type', context.payload.inputs.bump);
              return;
            }

            const { owner, repo } = context.repo;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });

            const pr = prs.find((candidate) => candidate.merged_at) ?? prs[0];

            if (!pr) {
              core.setFailed('No merged pull request found for this master commit. Add a version label through a PR or run this workflow manually.');
              return;
            }

            const labels = pr.labels.map((label) => label.name);
            const versionLabels = labels.filter((label) => [
              'version:patch',
              'version:minor',
              'version:major',
            ].includes(label));

            if (versionLabels.length !== 1) {
              core.setFailed(`Expected exactly one version label on PR #${pr.number}: version:patch, version:minor, or version:major. Found: ${versionLabels.join(', ') || 'none'}`);
              return;
            }

            core.setOutput('type', versionLabels[0].replace('version:', ''));
            core.setOutput('pr_number', String(pr.number));

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          BUMP="${{ steps.bump.outputs.type }}"
          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi

          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Unknown bump type: $BUMP"
              exit 1
              ;;
          esac

          NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "Tag $NEXT_TAG already exists."
            exit 1
          fi

          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          NEXT_TAG="${{ steps.version.outputs.next }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          NEXT_TAG="${{ steps.version.outputs.next }}"

          gh release create "$NEXT_TAG" \
            --title "$NEXT_TAG" \
            --generate-notes

      - name: Trigger Forge deployment
        env:
          FORGE_DEPLOY_WEBHOOK_URL: ${{ secrets.FORGE_DEPLOY_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$FORGE_DEPLOY_WEBHOOK_URL" ]; then
            echo "FORGE_DEPLOY_WEBHOOK_URL secret is missing."
            exit 1
          fi

          curl -fsS -X POST "$FORGE_DEPLOY_WEBHOOK_URL"
